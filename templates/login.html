<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Entrar - TrampoHub</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>


<main class="login-container">

    <section class="login-card">


        <a
            href="{{ url_for('routes.inicio') }}"
            class="brand login-brand"
        >
            Trampo<span>Hub</span>
        </a>


        <h1>
            Entrar
        </h1>

        <p>
            Acesse sua conta para continuar.
        </p>


        {% if erro %}

            <div class="alert alert-error">
                {{ erro }}
            </div>

        {% endif %}


        <form
            method="POST"
            action="{{ url_for('routes.login') }}"
        >

            <input
                type="hidden"
                name="tipo"
                value="{{ tipo }}"
            >


            <div class="form-group">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="seu@email.com"
                    required
                >

            </div>


            <div class="form-group">

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    required
                >

            </div>


            <button
                type="submit"
                class="full-button"
            >
                Entrar
            </button>


        </form>


        <div class="login-footer">

            <p>
                Ainda não possui uma conta?
            </p>

            <a href="{{ url_for('routes.cadastro') }}">
                Criar conta
            </a>

        </div>


    </section>

</main>

</body>

</html>
